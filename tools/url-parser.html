<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Parser • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>URL Parser</h1><p>Inspect URL components.</p><input id="i" placeholder="https://example.com/path?q=1"><button onclick="go()">Parse</button><pre id="o"></pre><script>function go(){try{let u=new URL(i.value);o.textContent=JSON.stringify({protocol:u.protocol,host:u.host,hostname:u.hostname,port:u.port,path:u.pathname,query:u.search,hash:u.hash},null,2)}catch(e){o.textContent="Invalid URL"}}</script></div></div></body></html>
