<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hash Generator • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>Hash Generator</h1><p>Create cryptographic hashes with the browser Web Crypto API.</p><textarea id="i" placeholder="Text to hash"></textarea><button onclick="go('SHA-256')">SHA-256</button><button onclick="go('SHA-512')">SHA-512</button><pre id="o"></pre><script>async function go(a){let b=await crypto.subtle.digest(a,new TextEncoder().encode(i.value));o.textContent=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}</script></div></div></body></html>
