<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>JSON Formatter</h1><p>Format or minify JSON.</p><textarea id="i" placeholder='{"name":"LEMON","tools":16}'></textarea><div class="row"><button onclick="format()">Format</button><button onclick="mini()">Minify</button></div><textarea id="o" readonly></textarea><script>function format(){try{o.value=JSON.stringify(JSON.parse(i.value),null,2)}catch(e){o.value="Invalid JSON: "+e.message}}function mini(){try{o.value=JSON.stringify(JSON.parse(i.value))}catch(e){o.value="Invalid JSON: "+e.message}}</script></div></div></body></html>
