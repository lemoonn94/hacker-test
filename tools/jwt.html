<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JWT Decoder • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>JWT Decoder</h1><p>Decode JWT header and payload locally.</p><textarea id="i" placeholder="Paste JWT..."></textarea><button onclick="go()">Decode</button><pre id="o"></pre><script>function go(){try{let p=i.value.split(".");let d=x=>JSON.stringify(JSON.parse(atob(p[x].replace(/-/g,"+").replace(/_/g,"/"))),null,2);o.textContent="HEADER\\n"+d(0)+"\\n\\nPAYLOAD\\n"+d(1)}catch(e){o.textContent="Invalid JWT"}} </script></div></div></body></html>
