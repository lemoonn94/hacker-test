<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary ↔ Text • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>Binary ↔ Text</h1><p>Convert binary and text.</p><textarea id="i" placeholder="01001000 01101001"></textarea><div class="row"><button onclick="dec()">Binary → Text</button><button onclick="enc()">Text → Binary</button></div><textarea id="o"></textarea><script>function dec(){try{o.value=i.value.trim().split(/\\s+/).map(x=>String.fromCharCode(parseInt(x,2))).join("")}catch(e){o.value="Invalid binary"}}function enc(){o.value=[...i.value].map(x=>x.charCodeAt(0).toString(2).padStart(8,"0")).join(" ")}</script></div></div></body></html>
