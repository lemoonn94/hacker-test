<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicode Converter • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>Unicode Converter</h1><p>Convert text to Unicode escapes.</p><textarea id="i"></textarea><div class="row"><button onclick="enc()">Encode</button><button onclick="dec()">Decode</button></div><textarea id="o"></textarea><script>function enc(){o.value=[...i.value].map(c=>"\\\\u"+c.charCodeAt(0).toString(16).padStart(4,"0")).join("")}function dec(){try{o.value=i.value.replace(/\\\\u([0-9a-f]{4})/gi,(_,x)=>String.fromCharCode(parseInt(x,16)))}catch(e){o.value="Invalid Unicode"}}</script></div></div></body></html>
