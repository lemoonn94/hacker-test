<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEX ↔ Text • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>HEX ↔ Text</h1><p>Convert hexadecimal and text.</p><textarea id="i"></textarea><div class="row"><button onclick="dec()">HEX → Text</button><button onclick="enc()">Text → HEX</button></div><textarea id="o"></textarea><script>function dec(){try{o.value=i.value.trim().match(/.{1,2}/g).map(x=>String.fromCharCode(parseInt(x,16))).join("")}catch(e){o.value="Invalid HEX"}}function enc(){o.value=[...i.value].map(x=>x.charCodeAt(0).toString(16).padStart(2,"0")).join(" ")}</script></div></div></body></html>
