<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Encoder / Decoder • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>URL Encoder / Decoder</h1><p>Encode or decode URL text.</p><textarea id="i" placeholder="Enter URL/text..."></textarea><div class="row"><button onclick="enc()">Encode</button><button onclick="dec()">Decode</button></div><textarea id="o" readonly></textarea><script>function enc(){o.value=encodeURIComponent(i.value)}function dec(){try{o.value=decodeURIComponent(i.value)}catch(e){o.value="Invalid URL encoding"}}</script></div></div></body></html>
