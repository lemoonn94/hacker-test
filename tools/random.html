<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random String Generator • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>Random String Generator</h1><p>Generate random strings locally.</p><input id="n" type="number" min="4" max="128" value="24"><button onclick="go()">Generate</button><div class="result" id="o"></div><script>function go(){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789",a=new Uint32Array(+n.value);crypto.getRandomValues(a);o.textContent=[...a].map(x=>c[x%c.length]).join("")}go()</script></div></div></body></html>
