<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timestamp Converter • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>Timestamp Converter</h1><p>Convert Unix timestamps and dates.</p><input id="i" type="text" placeholder="Unix timestamp or leave empty"><button onclick="go()">Convert</button><div class="result" id="o"></div><script>function go(){let v=i.value.trim();let d=v?(String(v).length<=10?new Date(Number(v)*1000):new Date(Number(v))):new Date();o.textContent="ISO: "+d.toISOString()+"\\nLocal: "+d.toString()+"\\nUnix: "+Math.floor(d.getTime()/1000)}</script></div></div></body></html>
