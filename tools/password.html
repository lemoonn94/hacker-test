<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>Password Generator</h1><p>Generate a secure password locally.</p><label>Length <input id="len" type="range" min="6" max="64" value="20"> <output id="lv">20</output></label><div class="result" id="out"></div><button onclick="gen()">⚡ Generate</button><button onclick="copy()">📋 Copy</button><script>const C="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-+=";function gen(){let n=+len.value,s="";crypto.getRandomValues(new Uint32Array(n)).forEach(x=>s+=C[x%C.length]);out.textContent=s}function copy(){navigator.clipboard.writeText(out.textContent)}len.oninput=()=>lv.textContent=len.value;gen()</script></div></div></body></html>
