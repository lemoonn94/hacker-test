<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Converter • LEMON CYBER</title><link rel="stylesheet" href="../tool.css"></head><body><div class="wrap"><a class="back" href="../index.html">← LEMON CYBER TOOLS</a><div class="box"><div>🛡️ LEMON CYBER</div><h1>Color Converter</h1><p>Convert HEX to RGB.</p><input id="i" placeholder="#b8ff45" value="#b8ff45"><button onclick="go()">Convert</button><div class="result" id="o"></div><script>function go(){let x=i.value.replace("#","");if(x.length===3)x=x.split("").map(a=>a+a).join("");let n=parseInt(x,16);o.textContent=`RGB(${n>>16}, ${(n>>8)&255}, ${n&255})`};go()</script></div></div></body></html>
